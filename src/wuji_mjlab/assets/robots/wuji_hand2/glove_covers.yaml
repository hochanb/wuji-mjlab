# Wuji Hand 2 glove covers: soft covers on the palm and the proximal / middle
# phalanges (fingertips stay bare). Imported from wuji-description v2026.11.9
# (https://github.com/wuji-technology/wuji-description, MIT),
# hand2/hand2_2/body/mjcf/right_with_glove.xml: one body per cover, welded to
# its link, with a collision mesh (the cover STL in meshes/right/). Pose in the
# parent link frame; covers on the palm are moved from the upstream palm frame
# into ours (upstream is rotated 1.858 deg about y and offset 0.3 mm; the finger
# link frames agree). Change: the adductor pollicis cover (thumb-index web,
# upstream on the palm) rides on thumb link1 (the short link between the
# thumb's first two joints), same pose at zero joints.
# excludes: the upstream cover contact exclusions, plus the web against the
# palm covers it now slides along.
