# Many-to-many goal curriculum: all 3000 cube_dex_3k grasps as initial
# states; goal sets of 1, 3, 10, 30 grasps (one per grasp type
# first, spread out by farthest-point sampling; nested), from
# src/tools/make_goal_type_curriculum.py; grasp sets not in git.
version: 1
hand: wuji_hand2_right
encoding: {name: none, dim: 0}
object_root: ../objects
stages:
  - name: goals1
    objects: [cube]
    init_grasps: {cube: [grasps/cube_dex_3k/all]}
    goal_grasps: {cube: [grasps/cube_dex_3k_goals30/goals_1]}
    advance: {after_iterations: 1250}
  - name: goals3
    objects: [cube]
    init_grasps: {cube: [grasps/cube_dex_3k/all]}
    goal_grasps: {cube: [grasps/cube_dex_3k_goals30/goals_3]}
    advance: {after_iterations: 1250}
  - name: goals10
    objects: [cube]
    init_grasps: {cube: [grasps/cube_dex_3k/all]}
    goal_grasps: {cube: [grasps/cube_dex_3k_goals30/goals_10]}
    advance: {after_iterations: 1250}
  - name: goals30
    objects: [cube]
    init_grasps: {cube: [grasps/cube_dex_3k/all]}
    goal_grasps: {cube: [grasps/cube_dex_3k_goals30/goals_30]}
    advance: {after_iterations: 1250}
