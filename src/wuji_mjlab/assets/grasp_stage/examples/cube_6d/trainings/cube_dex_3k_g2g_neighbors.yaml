# Dexonomy cube grasps (3000, 26 grasp types) from
# src/tools/dexonomy/make_dexonomy_grasp_sets.py; grasp sets not in git.
# Grasp-to-grasp chains (DexHOT style): each goal is a neighbour of the
# initial grasp or of the goal just reached, (20, 40] mm apart in mean hand
# keypoint distance in the object frame. Build the table first:
#   pixi run python src/tools/grasp_neighbors.py \
#     src/wuji_mjlab/assets/grasp_stage/examples/cube_6d/objects/cube/grasps/cube_dex_3k/all
version: 1
hand: wuji_hand2_right
encoding: {name: none, dim: 0}
object_root: ../objects
stages:
  - name: g2g
    objects: [cube]
    init_grasps: {cube: [grasps/cube_dex_3k/all]}
    goal_grasps: {cube: [grasps/cube_dex_3k/all]}
    goal_sampling: neighbors
    advance: {after_iterations: 10000}
