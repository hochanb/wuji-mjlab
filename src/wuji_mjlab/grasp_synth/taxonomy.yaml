# GRASP taxonomy grasp types for Wuji Hand 2, retargeted from the Dexonomy
# Shadow-hand annotations (github.com/JYChen18/Dexonomy, assets/hand/shadow/
# raw_anno; CC BY-NC 4.0): per type the contacts [finger (0 palm, 1 thumb ..
# 5 pinky), link, side] and an initial hand shape: Shadow joints mapped onto
# the Wuji MCP / abduction / PIP / DIP, then the contacting fingers fitted
# jointly with a similarity transform of the Shadow contacts (their relative
# geometry kept; palm contacts pin it to the palm).
# Used as the starting template when the library has none for the type.
# joint_bounds (regex: [lo, hi]) give a type's posture, set by hand where the
# synthesized grasps drifted from it (palmar, parallel extension, extension
# type, adduction grip, prismatic, small diameter thumb, adducted thumb); palmar
# and parallel extension keep the four fingers aligned (abduction ~0), and
# palmar presses the thumb tip against the other side of the fingers.
